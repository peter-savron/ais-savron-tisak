
# Logging
quarkus.log.console.enable=false
quarkus.log.file.enable=false

cli.logging.file-name=ais-cli.log
cli.logging.level=INFO
cli.logging.rotation-suffix=.yyyy-MM-dd
cli.logging.append=true
cli.logging.pattern=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

cli.logging.category."si.fri.ais".level=TRACE